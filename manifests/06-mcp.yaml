# DraCor MCP: lets AI assistants (MCP clients) query this DraCor instance.
# Talks to the API inside the project. Stateless, no password: the write tools
# of the MCP (adding or removing corpora) need the eXist admin password, which
# this public service does not get, so it can only read.
#
# Before importing, replace:
#   the values marked REPLACE-WITH: the host of the route "dracor" (without
#   https://) and your cluster (eu-1, eu-2, ...); see the guide, section 5.7
#
# Register in Claude Code (note the trailing slash):
#   claude mcp add --transport http dracor https://<your host>/mcp/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dracor-mcp
  labels:
    app: dracor-mcp
    app.kubernetes.io/part-of: dracor
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  strategy:
    type: Recreate   # tight Small quota: no second pod during updates
  selector:
    matchLabels:
      app: dracor-mcp
  template:
    metadata:
      labels:
        app: dracor-mcp
    spec:
      containers:
        - name: mcp
          image: registry.REPLACE-WITH-YOUR-CLUSTER.paas.open-science-cloud.ec.europa.eu/base/dracor/mcp:v1.0.0-alpha.4@sha256:516c35ecf53e3b8502589ccf8e3cd79b0829b162fb070f5582a368751e978283
          # short service name is enough here (Python uses the cluster resolver)
          env:
            - name: DRACOR_API_BASE_URL
              value: http://dracor-api:8080/exist/restxq/v1
            - name: DRACOR_MCP_TRANSPORT
              value: streamable-http
          ports:
            - name: http
              containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 100m
              memory: 256Mi
          # the MCP has no health endpoint; check that the port is open
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dracor-mcp
  labels:
    app.kubernetes.io/part-of: dracor
    app.kubernetes.io/component: mcp
spec:
  selector:
    app: dracor-mcp
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Same public address as the web interface, path /mcp.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dracor-mcp
  labels:
    app.kubernetes.io/part-of: dracor
    app.kubernetes.io/component: mcp
  annotations:
    haproxy.router.openshift.io/timeout: 120s   # some MCP calls take a while
spec:
  host: REPLACE-WITH-YOUR-HOST
  path: /mcp
  to:
    kind: Service
    name: dracor-mcp
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
