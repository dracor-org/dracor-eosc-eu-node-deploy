# DraCor metrics: network metrics service, used by the API. Stateless.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dracor-metrics
  labels:
    app: dracor-metrics
    app.kubernetes.io/part-of: dracor
    app.kubernetes.io/component: metrics
spec:
  replicas: 1
  strategy:
    type: Recreate   # tight Small quota: no second pod during updates
  selector:
    matchLabels:
      app: dracor-metrics
  template:
    metadata:
      labels:
        app: dracor-metrics
    spec:
      containers:
        - name: metrics
          image: registry.eu-2.paas.open-science-cloud.ec.europa.eu/base/ingoboerner/dracor-metrics-eosc:1.5.3@sha256:366c6e10648ad07a509a957bf153cfd035f115e32f908706612bf7cc9fa2343c
          ports:
            - name: http
              containerPort: 8030
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 300m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dracor-metrics
  labels:
    app.kubernetes.io/part-of: dracor
    app.kubernetes.io/component: metrics
spec:
  selector:
    app: dracor-metrics
  ports:
    - name: http
      port: 8030
      targetPort: http
